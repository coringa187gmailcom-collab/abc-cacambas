<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - ABC Caçambas</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: white; padding: 32px; border-radius: 12px; width: 100%; max-width: 360px; }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .erro { color: #e74c3c; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Admin ABC Caçambas</h2>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <form method="post">
      <input type="text" name="user" placeholder="Usuário" required>
      <input type="password" name="pass" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
